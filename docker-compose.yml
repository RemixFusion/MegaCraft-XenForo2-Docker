version: '3.3'

services:
  nginx:
    build:
      context: ./
      dockerfile: nginx.dockerfile
    ports:
      - "8003:80" # HTTP Port
      - "9003:443" # HTTPS Port
    volumes_from:
      - php
    volumes:
      - ./.config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./.config/nginx/certs:/etc/nginx/certs:ro
      - ./.data/nginx:/var/log/nginx
    links:
      - php
    networks:
      - xenforo
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw
  php:
    build:
      context: ./
      dockerfile: php82.dockerfile # availables php72.dockerfile php80.dockerfile php81.dockerfile
    volumes:
      - ./xenforo:/var/www/html
      - ./addons:/var/www/html/src/addons
      - ./xenforo/src/addons/XF:/var/www/html/src/addons/XF
      - ./.data/xenforo/internal:/var/www/html/internal_data
      - ./.data/xenforo/external:/var/www/html/data
      - ./.data/composer:/root/.composer
      - ./certbot/www:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/nginx/ssl/:ro
    links:
      - mariadb
    networks:
      - xenforo
    env_file:
      - .env
  mariadb:
    image: mariadb:10.11
    volumes:
      - ./.data/mariadb:/var/lib/mysql
    networks:
      - xenforo
    env_file:
      - .env
networks:
  xenforo:
    driver: bridge
